{% extends "layout.html" %}
{% block content %}
<h2 class="mb-4">Upload Image for Weight Prediction</h2>
<form method="POST" enctype="multipart/form-data" class="card p-4 shadow">
    <input type="file" name="image" accept="image/*" class="form-control mb-3" required>
    <button type="submit" class="btn btn-primary">Upload & Predict</button>
</form>

{% if filename %}
<div class="mt-4">
    <h5>Uploaded Image:</h5>
    <img src="{{ url_for('static', filename='uploads/' ~ filename) }}" width="200">
</div>
{% endif %}

{% if prediction %}
<div class="alert alert-success mt-3">
    {{ prediction }}
</div>
{% endif %}
{% endblock %}
